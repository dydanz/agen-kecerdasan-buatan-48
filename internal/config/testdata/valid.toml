[llm]
model = "claude-sonnet-4-6-20260326"
extraction_model = "claude-haiku-4-5-20251001"
api_key_env = "ANTHROPIC_API_KEY"
max_tokens = 4096

[adapters.cli]
enabled = true

[adapters.telegram]
enabled = false

[brain]
enabled = false

[session]
storage_dir = "sessions"
max_turns_in_context = 50

[skills]
dir = "skills"

[identity]
dir = "identity"
