version: "3.9"

services:
  akb48:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    dns:
      - 8.8.8.8
      - 8.8.4.4
    environment:
      MEMORY_FILE_PATH: /app/brain/memory.jsonl
    volumes:
      - sessions:/app/sessions
      - logs:/app/logs
      - brain:/app/brain
      - ./config.docker.toml:/app/config.toml:ro

  # GBrain + Postgres — only needed when brain.enabled = true in config.toml.
  # akb48 starts in degraded mode (brain tools unavailable) if these are not running.

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password

  gbrain:
    image: ghcr.io/gbrain/gbrain:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://brain@postgres/brain
    volumes:
      - ~/brain:/brain
    command: ["serve", "--dir", "/brain"]

volumes:
  pgdata:
  sessions:
  logs:
  brain:

secrets:
  pg_password:
    file: ./secrets/pg_password
