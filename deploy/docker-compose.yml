version: "3.9"

services:
  akb48:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: ../.env
    volumes:
      - sessions:/app/sessions
      - logs:/app/logs
      - ./config.docker.toml:/app/config.toml:ro
    # Uncomment when brain.enabled = true in config.toml:
    # depends_on:
    #   - gbrain

  # GBrain + Postgres — only needed when brain.enabled = true in config.toml.
  # akb48 starts in degraded mode (brain tools unavailable) if these are not running.

  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: brain
      POSTGRES_USER: brain
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    secrets:
      - pg_password

  gbrain:
    image: ghcr.io/gbrain/gbrain:latest
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgres://brain@postgres/brain
    volumes:
      - ~/brain:/brain
    command: ["serve", "--dir", "/brain"]

volumes:
  pgdata:
  sessions:
  logs:

secrets:
  pg_password:
    file: ./secrets/pg_password
